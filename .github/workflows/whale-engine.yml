# .github/workflows/whale-engine.yml
name: Whale Bulk/Block Deal Engine
on:
  schedule:
    - cron: '0 18 * * *'   # ~11:30 PM IST = 18:00 UTC, after NSE's end-of-day bulk/block deal batch is published
    - cron: '6 9 * * 1-5' # 
    - cron: '26 14 * * 1-5'
    - cron: '*/15 18-20 * * 1-5'
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run startWhale
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}