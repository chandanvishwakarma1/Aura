# .github/workflows/insider-engine.yml
name: Insider Disclosure Engine
on:
  schedule:
    - cron: '30 17 * * *'   # 11:00 PM IST = 17:30 UTC, every day (NSE publishes disclosures daily, not just weekdays)
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run startInsider
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}